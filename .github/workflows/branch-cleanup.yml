name: Cleanup Merged Remote Branches (Older than 30 Minutes - Testing)

on:
  push:
    branches:
      - dev
      
  schedule:
    # NOTE: This trigger only runs if the workflow file is on the DEFAULT branch.
    - cron: '10 * * * *'
    
  workflow_dispatch:
    branches:
      - dev

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout repository
        # Use 'dev' as the ref to ensure you check out the correct branch for context
        uses: actions/checkout@v4
        with:
          ref: 'dev' 
          # Fetch depth 0 ensures all branches are available for git log and branch checks
          fetch-depth: 0 

      - name: Fetch all branches (Required for accurate merged checks)
        run: git fetch --all

      - name: Delete old merged branches
        # NO env block needed here, we'll use the secret directly in the run command
        shell: bash
        run: |
          echo "--- Starting Branch Cleanup Script ---"
          
          # Define age threshold in seconds (2 minutes * 60 seconds/minute for testing)
          SECONDS_OLD=$((2 * 60)) 
          THRESHOLD_MINUTES=$(( SECONDS_OLD / 60 ))
          echo "Current Deletion Threshold: Branches older than $THRESHOLD_MINUTES minutes (last commit date)."

          # Set the token variable from the secret
          # Injecting the token into the URL is the most reliable method for push operations
          GH_TOKEN="${{ secrets.GH_TOKEN }}"
          REPO_URL="https://${GH_TOKEN}@github.com/${{ github.repository }}"
          
          # Get the current date in seconds since epoch
          NOW=$(date +%s)

          # Find branches merged into 'origin/dev', excluding protected branches
          MERGED_BRANCHES=$(git branch -r --merged origin/dev | grep -vE 'origin/(main|development|master|dev)$' | sed 's|origin/||')
          
          if [ -z "$MERGED_BRANCHES" ]; then
            echo "No merged branches found (or they are protected branches)."
            exit 0
          fi

          echo "Found merged branches: $MERGED_BRANCHES"
          
          for branch in $MERGED_BRANCHES; do
            echo "-------------------------------------"
            echo "Checking branch: $branch"

            # The git log command uses the local clone, so it works fine.
            LAST_COMMIT_DATE=$(git log -1 --format=%ct origin/$branch)

            # Calculate age in seconds
            AGE=$(( NOW - LAST_COMMIT_DATE ))
            AGE_MINUTES=$(( AGE / 60 ))

            echo "  -> Last commit was $AGE_MINUTES minutes ago (Threshold: $THRESHOLD_MINUTES minutes)"

            if [ "$AGE" -ge "$SECONDS_OLD" ]; then
              echo "  -> 🗑️ Deleting $branch (merged and older than $THRESHOLD_MINUTES minutes)"
              
              # 🚀 Actual deletion command - Pushing using the tokenized URL
              git push "$REPO_URL" --delete "$branch"
            else
              echo "  -> ⏭️ Skipping $branch (merged but recent)"
            fi
          done
          echo "--- Cleanup Script Finished ---"