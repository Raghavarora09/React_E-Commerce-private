name: Cleanup Merged Remote Branches (Older than 30 Minutes - Testing)

on:
  push:
    branches:
      - dev
  schedule:
    # Runs every hour at 10 minutes past the hour for frequent testing (e.g., 8:10, 9:10, etc. UTC)
    # NOTE: This trigger only runs if the workflow file is on the DEFAULT branch (e.g., main/master).
    - cron: '10 * * * *'
  workflow_dispatch:
    # Optional: Restrict manual runs to the 'dev' branch for testing purposes.
    # If the workflow is on the 'dev' branch, this is redundant but harmless.
    branches:
      - dev

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Use 'dev' as the ref to ensure you check out the correct branch for context
        uses: actions/checkout@v4
        with:
          ref: 'dev' 

      - name: Fetch all branches
        run: |
          git fetch --all

      - name: Delete old merged branches
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Define age threshold in seconds (30 minutes * 60 seconds/minute)
          SECONDS_OLD=$((30 * 60)) 
          THRESHOLD_MINUTES=$(( SECONDS_OLD / 60 ))

          # Get the current date in seconds since epoch
          NOW=$(date +%s)

          # Get all remote branches merged into 'origin/dev'
          # This ensures only branches merged into 'dev' are considered for deletion.
          for branch in $(git branch -r --merged origin/dev | grep -vE 'origin/(main|development|master|dev)$' | sed 's|origin/||'); do
            echo "Checking branch: $branch"

            # Get last commit date (in epoch seconds) of the branch
            LAST_COMMIT_DATE=$(git log -1 --format=%ct origin/$branch)

            # Calculate age in seconds
            AGE=$(( NOW - LAST_COMMIT_DATE ))
            AGE_MINUTES=$(( AGE / 60 ))

            echo "  -> Last commit was $AGE_MINUTES minutes ago (Threshold: $THRESHOLD_MINUTES minutes)"

            if [ "$AGE" -ge "$SECONDS_OLD" ]; then
              echo "  -> Deleting $branch (merged and older than $THRESHOLD_MINUTES minutes)"
              # 🚀 Actual deletion command
              git push origin --delete "$branch"
            else
              echo "  -> Skipping $branch (merged but recent)"
            fi
          done